<style>

/* ══════════════════════════════════════════
   RESET
   ══════════════════════════════════════════ */

*,
*::before,
*::after {

  padding: 0;

}


/* ══════════════════════════════════════════
   PALETA YARI
   ══════════════════════════════════════════ */

:root {

  --white: #fffefe;

  --text: #683e50;

  --text-secondary: #85586a;

  --text-light: #a97889;


  --border:

  --border-soft:
    rgba(217, 111, 153, 0.20);


  --shadow:
    rgba(217, 111, 153, 0.15);

}


/* ══════════════════════════════════════════
   BODY
   ══════════════════════════════════════════ */

body {

  background:

    radial-gradient(
      circle at 10% 10%,
      rgba(255, 207, 225, 0.9),
      transparent 30%
    ),

    radial-gradient(
      circle at 90% 85%,
      rgba(248, 190, 213, 0.75),
      transparent 32%
    ),

    radial-gradient(
      circle at 50% 50%,
      rgba(255,255,255,0.95),
      transparent 52%
    ),

    linear-gradient(
      135deg,
      #ffffff 0%,
      #fff7fa 48%,
      #ffe9f2 100%
    );


  color: var(--text);


  font-family:
    'Jost',
    sans-serif;


  font-weight: 300;


  min-height: 100vh;


  overflow-x: hidden;


  position: relative;

}


/* ══════════════════════════════════════════
   TEXTURA
   ══════════════════════════════════════════ */

body::before {

  content: '';

  position: fixed;

  inset: 0;

  background-image:

    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");

  background-size: 180px;

  opacity: 0.35;

  pointer-events: none;

  z-index: 1;

}


/* ══════════════════════════════════════════
   BRILLOS AMBIENTALES
   ══════════════════════════════════════════ */

.blob {

  position: fixed;

  border-radius: 50%;

  pointer-events: none;

  filter: blur(85px);

  z-index: 0;

}


.blob-1 {

  width: 430px;

  height: 430px;

  background:
    rgba(241, 150, 185, 0.24);

  top: -130px;

  right: -100px;

}


.blob-2 {

  width: 350px;

  height: 350px;

  background:
    rgba(247, 185, 210, 0.30);

  bottom: -110px;

  left: -100px;

}


.blob-3 {

  width: 250px;

  height: 250px;

  background:
    rgba(255, 220, 233, 0.35);

  top: 50%;

  left: 50%;

  transform:
    translate(-50%, -50%);

}


/* ══════════════════════════════════════════
   CANVAS ESTRELLAS
   ══════════════════════════════════════════ */

canvas#stars {

  position: fixed;

  inset: 0;

  z-index: 0;

  pointer-events: none;

}


/* ══════════════════════════════════════════
   CONTENEDOR
   ══════════════════════════════════════════ */

#app {

  position: relative;

  z-index: 2;

  min-height: 100vh;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  padding:
    3rem 1.5rem 5rem;

  text-align: center;

}


/* ══════════════════════════════════════════
   PANTALLAS
   ══════════════════════════════════════════ */

.screen {

  display: none;

  width: 100%;

}


.screen.active {

  display: flex;

  flex-direction: column;

  align-items: center;

}


/* ══════════════════════════════════════════
   TEXTO SUPERIOR
   ══════════════════════════════════════════ */

.eyebrow {

  font-family:
    'Jost',
    sans-serif;

  font-weight: 500;

  font-size: 0.65rem;

  letter-spacing: 0.28em;

  text-transform: uppercase;

  color:

  opacity: 0.95;

  margin-bottom: 2rem;

}


/* ══════════════════════════════════════════
   PANDA / GIF
   ══════════════════════════════════════════ */

.panda-wrap {

  position: relative;

  margin-bottom: 2rem;

}


.panda-wrap img {

  width:
    clamp(100px, 22vw, 150px);

  height:
    clamp(100px, 22vw, 150px);

  object-fit: cover;

  border-radius: 50%;

  border:

    rgba(217,111,153,0.38);

  padding: 5px;

  background:
    rgba(255,255,255,0.70);

  box-shadow:
    0 10px 35px
    rgba(217,111,153,0.16);

}


/* ══════════════════════════════════════════
   ANILLOS
   ══════════════════════════════════════════ */

.panda-ring {

  inset: -8px;

  border-radius: 50%;

  border:
    1px solid
    rgba(217,111,153,0.42);

  animation:
    pulse-ring
    3s
    ease-in-out
    infinite;

}


.panda-ring-2 {

  inset: -17px;

  border-radius: 50%;

    rgba(229,139,171,0.25);

    pulse-ring
    3s
    ease-in-out

}


@keyframes pulse-ring {

  }

/* ══════════════════════════════════════════

.particle {

@keyframes floatUp {

<script>


/* ══════════════════════════════════════════
   ESTRELLAS
   ══════════════════════════════════════════ */

const canvas =
  document.getElementById('stars');

const ctx =
  canvas.getContext('2d');

let stars = [];


function resizeC() {

  canvas.width =
    innerWidth;

  canvas.height =
    innerHeight;

}


resizeC();


addEventListener(
  'resize',
  resizeC
);


/*
   Estrellas pequeñas
*/

for (
  let i = 0;
  i < 150;
  i++
) {

  stars.push({

    x:
      Math.random() *
      innerWidth,

    y:
      Math.random() *
      innerHeight,

    r:
      Math.random() *
      1.1 +
      0.3,

    speed:
      Math.random() *
      0.004 +
      0.002,

    phase:
      Math.random() *
      Math.PI *
      2

  });

}


/*
   Estrellas grandes
   tipo ✦
*/

let sparkleStars = [];


for (
  let i = 0;
  i < 35;
  i++
) {

  sparkleStars.push({

    x:
      Math.random() *
      innerWidth,

    y:
      Math.random() *
      innerHeight,

    size:
      Math.random() *
      3 +
      2,

    speed:
      Math.random() *
      0.003 +
      0.001,

    phase:
      Math.random() *
      Math.PI *
      2

  });

}


/*
   Dibujar estrellas
*/

function drawS(t) {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* ───── estrellas pequeñas ───── */

  stars.forEach(s => {

    const a =
      0.25 +
      0.60 *
      (
        0.5 +
        0.5 *
        Math.sin(
          t *
          s.speed +
          s.phase
        )
      );


    ctx.beginPath();


    ctx.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
      `rgba(
        214,
        92,
        137,
        ${a.toFixed(3)}
      )`;


    ctx.fill();

  });


  /* ───── estrellas brillantes ───── */

  sparkleStars.forEach(s => {

    const a =
      0.25 +
      0.70 *
      (
        0.5 +
        0.5 *
        Math.sin(
          t *
          s.speed +
          s.phase
        )
      );


    const size =
      s.size *
      (
        0.75 +
        0.25 *
        Math.sin(
          t *
          s.speed +
          s.phase
        )
      );


    ctx.save();


    ctx.translate(
      s.x,
      s.y
    );


    ctx.rotate(
      Math.PI / 4
    );


    ctx.fillStyle =
      `rgba(
        217,
        111,
        153,
        ${a.toFixed(3)}
      )`;


    ctx.fillRect(
      -size / 2,
      -size / 2,
      size,
      size
    );


    ctx.restore();

  });


  requestAnimationFrame(
    drawS
  );

}


requestAnimationFrame(
  drawS
);


/* ══════════════════════════════════════════
   MENSAJES
   ══════════════════════════════════════════ */

const msgs = [

  "lit, eres mi dúo favorito para cualquier juego ♡",

  "entre partidas y partidas terminamos hablando de todo",

  "hemos compartido demasiados momentos bonitos",

  "la distancia nunca nos impidió pasarla increíble",

  "¿de verdad vas a decir que no a tu dúo?",

  "después de tantos juegos, esto ya estaba decidido",

  "Yari, sabes perfectamente cuál es la respuesta ♡",

  "no acepto un 'no' de mi mejor amiga",

  "tantas partidas juntos tenían que servir para algo",

  "solo falta que confirmes algo que los dos sabemos"

];


let mi = 0;

let ci = 0;

let del = false;


const tel =
  document.getElementById(
    'typetext'
  );


function typeLoop() {

  const cur =
    msgs[mi];


  if (del) {

    ci--;

  }

  else {

    ci++;

  }


  tel.textContent =
    cur.substring(
      0,
      ci
    );


  if (
    !del &&
    ci === cur.length
  ) {

    setTimeout(
      () => del = true,
      1400
    );

  }


  else if (
    del &&
    ci === 0
  ) {

    del = false;

    mi =
      (mi + 1)
      %
      msgs.length;

  }


  setTimeout(
    typeLoop,
    del
      ? 28
      : 55
  );

}


typeLoop();


/* ══════════════════════════════════════════
   BOTÓN NO
   ══════════════════════════════════════════ */

const noBtn =
  document.getElementById(
    'no-btn'
  );


const noWrap =
  document.getElementById(
    'no-wrap'
  );


const sndNo =
  document.getElementById(
    'snd-no'
  );


noBtn.addEventListener(
  'mouseenter',
  () => {

    sndNo.currentTime =
      0;

    sndNo
      .play()
      .catch(
        () => {}
      );

  }
);


noBtn.addEventListener(
  'mouseover',
  () => {

    const footer =
      70;


    const bw =
      noBtn.offsetWidth;


    const bh =
      noBtn.offsetHeight;


    const maxX =
      innerWidth -
      bw -
      20;


    const maxY =
      innerHeight -
      bh -
      footer -
      20;


    const x =
      Math.random() *
      Math.max(
        maxX,
        20
      );


    const y =
      Math.random() *
      Math.max(
        maxY,
        20
      );


    noBtn.style.position =
      'fixed';


    noBtn.style.left =
      x + 'px';


    noBtn.style.top =
      y + 'px';


    noBtn.style.zIndex =
      '100';

  }

);


/* ══════════════════════════════════════════
   BOTÓN SÍ
   ══════════════════════════════════════════ */

document
  .getElementById('yes-btn')
  .addEventListener(
    'click',
    () => {


      noBtn.style.position =
        '';


      document
        .getElementById(
          'snd-yes'
        )
        .play()
        .catch(
          () => {}
        );


      show(
        'screen-loading'
      );


      let pct =
        0;


      const loadMsgs = [

        'verificando nuestra amistad...',

        'calculando horas jugando en dúo...',

        'procesando nuestras conversaciones...',

        'recordando todos nuestros momentos...',

        'confirmando que somos un dúo increíble...',

        'preparando algo especial para Yari...',

        'casi listo, Yari... ♡'

      ];


      const fill =
        document.getElementById(
          'prog-fill'
        );


      const pctEl =
        document.getElementById(
          'prog-pct'
        );


      const msgEl =
        document.getElementById(
          'loading-msg'
        );


      const iv =
        setInterval(
          () => {

            pct++;


            fill.style.width =
              pct + '%';


            pctEl.textContent =
              pct + '%';


            const index =
              Math.min(
                Math.floor(
                  pct /
                  15
                ),
                loadMsgs.length - 1
              );


            msgEl.textContent =
              loadMsgs[index];


            spawnParticle();


            if (
              pct >= 100
            ) {

              clearInterval(iv);


              setTimeout(
                () => {

                  show(
                    'screen-final'
                  );

                },
                500
              );

            }

          },
          30
        );

    }
  );


/* ══════════════════════════════════════════
   CAMBIAR PANTALLA
   ══════════════════════════════════════════ */

function show(id) {

  document
    .querySelectorAll('.screen')
    .forEach(
      s =>
        s.classList.remove(
          'active'
        )
    );


  document
    .getElementById(id)
    .classList.add(
      'active'
    );

}


/* ══════════════════════════════════════════
   PARTÍCULAS
   ══════════════════════════════════════════ */

const emojis = [

  '♡',

  '✦',

  '✧',

  '💗',

  '🌸',

  '✨',

  '🎀'

];


function spawnParticle() {

  const p =
    document.createElement(
      'div'
    );


  p.className =
    'particle';


  p.textContent =
    emojis[
      Math.floor(
        Math.random() *
        emojis.length
      )
    ];


  p.style.left =
    Math.random() *
    100 +
    'vw';


  p.style.bottom =
    '60px';


  p.style.fontSize =
    (
      Math.random() *
      14 +
      14
    ) +
    'px';


  p.style.color =
    Math.random() > 0.5
      ? '#d96f99'
      : '#e58bad';


  document
    .body
    .appendChild(p);


  setTimeout(
    () =>
      p.remove(),
    5000
  );

}


/* ══════════════════════════════════════════
   NAVEGACIÓN
   ══════════════════════════════════════════ */

function goTo(url) {

  const mus =
    document.getElementById(
      'bg-music'
    );


  if (mus) {

    mus.pause();

  }


  window.open(
    url,
    "_blank"
  );


  const checkFocus =
    setInterval(
      () => {

        if (
          document.hasFocus()
        ) {

          if (mus) {

            mus
              .play()
              .catch(
                () => {}
              );

          }


          clearInterval(
            checkFocus
          );

        }

      },
      1000
    );

}
